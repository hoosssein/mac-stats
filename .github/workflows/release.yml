name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, for example 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="$INPUT_VERSION"; fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Bad version: $V"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Test
        run: swift test
      - name: Bundle universal app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/bundle.sh "${{ steps.v.outputs.version }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          NOTES="docs/release-notes/$V.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "v$V" "build/MacStats-$V.zip" \
            --title "Mac Stats $V" --notes-file "$NOTES" --target "$GITHUB_SHA"
