name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: StatsCore on Linux
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Test StatsCore
        run: swift test

  macos:
    name: Build, test and bundle on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (debug)
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle universal app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/bundle.sh "0.1.0-ci.${{ github.run_number }}"
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MacStats-ci-${{ github.run_number }}
          path: build/*.zip
          if-no-files-found: error
      - name: UI smoke test (opens real panels, checks they are visible)
        run: |
          APP="build/Mac Stats.app/Contents/MacOS/MacStats"
          MACSTATS_SELFTEST="$PWD/build/selftest.txt" "$APP" &
          PID=$!
          ( sleep 60; kill "$PID" 2>/dev/null ) &
          # Single instance: a second launch must quit by itself within a few seconds.
          sleep 2
          "$APP" &
          PID2=$!
          sleep 4
          DUPLICATE=0
          if kill -0 "$PID2" 2>/dev/null; then
            echo "FAIL second instance is still running"; kill "$PID2"; DUPLICATE=1
          else
            echo "PASS second instance quit by itself"
          fi
          sleep 2
          screencapture -x build/selftest-menus.png || true
          sleep 4
          screencapture -x build/selftest-overview.png || true
          STATUS=0
          wait "$PID" || STATUS=$?
          cat build/selftest.txt || echo "No report written"
          echo "--- app log (unified logging) ---"
          log show --last 3m --info --predicate 'subsystem == "app.macstats.MacStats"' --style compact | tail -40 || true
          if [ "$DUPLICATE" -ne 0 ]; then exit 1; fi
          exit "$STATUS"
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ github.run_number }}
          path: |
            build/selftest.txt
            build/selftest-*.png
          if-no-files-found: ignore
